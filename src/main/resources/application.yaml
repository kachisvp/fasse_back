# 全プロファイル共通の設定(dev / stg はこのファイルの設定で動く)
# 本ファイルはコミット対象のため、機密情報を直接書かず環境変数の参照のみを記載する
# local / test は application-local.yaml / application-test.yaml(.gitignore 対象)で上書きする
spring:
  application:
    name: fasse_back
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis:
  configuration:
    map-underscore-to-camel-case: true

fasse:
  jwt:
    # KMS 公開鍵(PEM)。未設定の場合は全 API が 401 を返す(フェイルクローズ)
    public-key-pem: ${JWT_PUBLIC_KEY_PEM:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
